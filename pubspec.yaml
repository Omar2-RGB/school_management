name: school_management
description: "A new Flutter project for school management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.3.4
  sqflite_common_ffi_web: ^0.4.5
  path_provider: ^2.1.6
  path: ^1.9.0
  pdf: ^3.11.0            # ✅ تم التخفيض
  printing: ^5.11.0       # ✅ تم التخفيض
  table_calendar: ^3.1.2
  fl_chart: ^0.70.2
  image_picker: ^1.1.0
  google_fonts: ^6.2.1    # ✅ تم التخفيض سابقاً
  cross_file: ^0.3.4
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0    # ✅ تم التخفيض سابقاً
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A73E8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true